<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝思咏姐姐天天开心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffe0ec 0%, #f7d6ff 50%, #d6e4ff 100%);
            background-attachment: fixed;
            color: #333;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .aurora {
            position: fixed; inset: -20%; z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,150,200,0.55), transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(180,140,255,0.5), transparent 45%),
                radial-gradient(circle at 70% 80%, rgba(120,170,255,0.45), transparent 45%),
                radial-gradient(circle at 30% 85%, rgba(255,200,150,0.4), transparent 45%);
            animation: auroraMove 18s ease-in-out infinite alternate;
            filter: blur(20px);
            pointer-events: none;
        }
        @keyframes auroraMove {
            0% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-4%,3%) scale(1.08); }
            100% { transform: translate(4%,-3%) scale(1.05); }
        }

        .stars {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 70% 15%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1.5px 1.5px at 40% 60%, rgba(255,255,255,0.85), transparent),
                radial-gradient(2px 2px at 85% 70%, rgba(255,255,255,0.9), transparent),
                radial-gradient(1.5px 1.5px at 25% 80%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 60% 90%, rgba(255,255,255,0.85), transparent),
                radial-gradient(1.5px 1.5px at 90% 40%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 10% 50%, rgba(255,255,255,0.75), transparent);
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        .bubble {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(2px);
        }
        .bubble:nth-child(1) { width: 140px; height: 140px; top: 10%; left: 6%; background: radial-gradient(circle, rgba(255,180,220,0.6), transparent 70%); animation: float1 14s ease-in-out infinite; }
        .bubble:nth-child(2) { width: 90px; height: 90px; top: 18%; right: 10%; background: radial-gradient(circle, rgba(200,170,255,0.6), transparent 70%); animation: float2 16s ease-in-out infinite; }
        .bubble:nth-child(3) { width: 180px; height: 180px; bottom: 6%; left: 12%; background: radial-gradient(circle, rgba(170,200,255,0.5), transparent 70%); animation: float3 18s ease-in-out infinite; }
        .bubble:nth-child(4) { width: 70px; height: 70px; bottom: 18%; right: 8%; background: radial-gradient(circle, rgba(255,210,180,0.55), transparent 70%); animation: float1 12s ease-in-out infinite reverse; }
        .bubble:nth-child(5) { width: 110px; height: 110px; top: 45%; left: 50%; background: radial-gradient(circle, rgba(255,170,210,0.4), transparent 70%); animation: float2 20s ease-in-out infinite; }
        @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-40px) scale(1.15); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,30px) scale(1.1); } }
        @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,50px) scale(1.08); } }

        .glow-orb { position: fixed; border-radius: 50%; filter: blur(60px); pointer-events: none; z-index: 0; opacity: 0.5; }
        .orb1 { width: 300px; height: 300px; top: -80px; left: -80px; background: rgba(255,140,200,0.7); animation: orbMove1 22s ease-in-out infinite alternate; }
        .orb2 { width: 260px; height: 260px; bottom: -60px; right: -60px; background: rgba(150,170,255,0.7); animation: orbMove2 26s ease-in-out infinite alternate; }
        @keyframes orbMove1 { 0% { transform: translate(0,0); } 100% { transform: translate(80px,60px); } }
        @keyframes orbMove2 { 0% { transform: translate(0,0); } 100% { transform: translate(-70px,-50px); } }

        .card {
            position: relative; z-index: 2;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-radius: 28px; padding: 56px 40px; max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(180,120,160,0.22), 0 0 0 1px rgba(255,255,255,0.6) inset;
            border: 1px solid rgba(255,255,255,0.85);
            transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.6s;
        }
        body.playing .card {
            transform: scale(1.02);
            box-shadow: 0 22px 70px rgba(200,100,170,0.3), 0 0 0 1px rgba(255,255,255,0.8) inset;
        }

        /* 最终阶段：卡片暖色光晕 */
        body.playing.final .card {
            box-shadow: 0 22px 70px rgba(255,170,120,0.35), 0 0 50px rgba(255,210,150,0.35), 0 0 0 1px rgba(255,255,255,0.8) inset;
        }

        .emoji { font-size: 56px; display: block; margin-bottom: 20px; animation: bounce 2s ease-in-out infinite; position: relative; z-index: 3; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .wish-wrap { position: relative; min-height: 90px; display: flex; align-items: center; justify-content: center; z-index: 3; }
        .wish {
            font-size: 28px; font-weight: 700; line-height: 1.6;
            background: linear-gradient(90deg, #ff5f9e, #b56bff, #5f8dff);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            letter-spacing: 1px; transition: opacity 1.6s ease, transform 1.6s ease;
        }

        body.playing .wish.first { opacity: 0; transform: translateY(-24px); position: absolute; }

        .wish.second { opacity: 0; transform: translateY(24px); position: absolute; transition: opacity 1.6s ease, transform 1.6s ease; }
        body.playing .wish.second { opacity: 1; transform: translateY(0); }

        .wish.third { opacity: 0; transform: translateY(24px); position: absolute; transition: opacity 1.8s ease, transform 1.8s ease; }
        body.playing.mid .wish.second { opacity: 0; transform: translateY(-24px); }
        body.playing.mid .wish.third { opacity: 1; transform: translateY(0); }

        .wish.fourth { opacity: 0; transform: translateY(24px); position: absolute; transition: opacity 2.2s ease, transform 2.2s ease; }
        body.playing.final .wish.third { opacity: 0; transform: translateY(-24px); }
        body.playing.final .wish.fourth { opacity: 1; transform: translateY(0); }

        /* 最后一句出现后：文字微微发光呼吸 */
        body.playing.final .wish.fourth {
            animation: finalGlow 2.4s ease-in-out infinite alternate;
        }
        @keyframes finalGlow {
            0% { filter: drop-shadow(0 0 4px rgba(255,150,200,0.4)); }
            100% { filter: drop-shadow(0 0 16px rgba(255,180,220,0.9)); }
        }

        .divider { width: 60px; height: 4px; border-radius: 2px; margin: 24px auto; background: linear-gradient(90deg, #ffb3d1, #d4b3ff); position: relative; z-index: 3; }

        .hint {
            font-size: 15px; color: #8a7a8a; display: flex; align-items: center; justify-content: center; gap: 8px;
            animation: pulse 2s ease-in-out infinite; position: relative; z-index: 3;
        }
        @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
        .hint .icon { font-size: 20px; }
        body.playing .hint { opacity: 0; transform: translateY(10px); transition: opacity 0.5s, transform 0.5s; }

        .ring {
            position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid rgba(255,140,190,0.5);
            transform: translate(-50%,-50%) scale(0); pointer-events: none; z-index: 5; opacity: 0;
        }
        body.playing .ring { animation: ringExpand 1.3s ease-out forwards; }
        @keyframes ringExpand {
            0% { transform: translate(-50%,-50%) scale(0); opacity: 0.7; }
            100% { transform: translate(-50%,-50%) scale(16); opacity: 0; }
        }

        /* 最终阶段的金色光环 */
        .gold-ring {
            position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border-radius: 50%;
            border: 3px solid rgba(255,200,120,0.8);
            box-shadow: 0 0 40px rgba(255,210,140,0.8);
            transform: translate(-50%,-50%) scale(0); pointer-events: none; z-index: 5; opacity: 0;
        }
        body.playing.final .gold-ring {
            animation: goldExpand 1.8s ease-out forwards;
        }
        @keyframes goldExpand {
            0% { transform: translate(-50%,-50%) scale(0); opacity: 0.9; }
            100% { transform: translate(-50%,-50%) scale(20); opacity: 0; }
        }

        .heart {
            position: fixed; top: -40px; font-size: 20px; pointer-events: none; z-index: 4;
            animation: fall linear forwards; opacity: 0.6;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .spark {
            position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 6;
            animation: sparkFly 1s ease-out forwards;
        }
        @keyframes sparkFly {
            0% { transform: translate(0,0) scale(1); opacity: 0.8; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="stars"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="card">
        <span class="emoji">💖</span>
        <div class="wish-wrap">
            <p class="wish first">祝思咏姐姐<br>天天开心！</p>
            <p class="wish second">土豆<br>健康快乐</p>
            <p class="wish third">古巷逶迤<br>你我长青</p>
            <p class="wish fourth">希望和姐姐<br>岁岁年年</p>
        </div>
        <div class="divider"></div>
        <p class="hint"><span class="icon">🎵</span> 轻触屏幕，接收祝福</p>
    </div>

    <div class="ring"></div>
    <div class="gold-ring"></div>

    <audio id="myAudio" src="愿与愁 - 林俊杰.mp3" preload="auto"></audio>

    <script>
        const audio = document.getElementById('myAudio');
        const heartEmojis = ['💖', '💗', '💕', '🌸', '✨', '💝', '🌟', '💫'];
        let heartTimer = null;
        let triggered = false;

        function spawnHearts(count, festive) {
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = festive
                    ? ['💛', '✨', '🌟', '💫', '💖'][Math.floor(Math.random() * 5)]
                    : heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (14 + Math.random() * 16) + 'px';
                heart.style.animationDuration = (3 + Math.random() * 2.5) + 's';
                heart.style.animationDelay = (Math.random() * 0.8) + 's';
                heart.style.opacity = (0.45 + Math.random() * 0.35).toFixed(2);
                document.body.appendChild(heart);
                heart.addEventListener('animationend', function () { heart.remove(); });
            }
        }

        function startContinuousHearts() {
            if (heartTimer) return;
            spawnHearts(8);
            heartTimer = setInterval(function () {
                spawnHearts(3 + Math.floor(Math.random() * 3));
            }, 900);
        }

        function burstSparks(x, y, festive) {
            const colors = festive
                ? ['#ffd280', '#ffe0a0', '#ffb3d1', '#fff0c0', '#ffc0e0']
                : ['#ff8fb8', '#c99bff', '#8fb3ff', '#ffd1e3'];
            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
                const dist = 40 + Math.random() * 70;
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                spark.style.background = colors[Math.floor(Math.random() * colors.length)];
                spark.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                spark.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                document.body.appendChild(spark);
                spark.addEventListener('animationend', function () { spark.remove(); });
            }
        }

        function triggerAll(x, y) {
            if (triggered) return;
            triggered = true;

            document.body.classList.add('playing');
            startContinuousHearts();
            burstSparks(x, y, false);

            // 6 秒后：古巷逶迤，你我长青
            setTimeout(function () { document.body.classList.add('mid'); }, 6000);

            // 12 秒后：希望和姐姐岁岁年年 + 收尾效果
            setTimeout(function () {
                document.body.classList.add('final');
                // 金色星光从卡片中心爆开
                burstSparks(window.innerWidth / 2, window.innerHeight / 2, true);
                // 密集飘落一波金色爱心
                spawnHearts(24, true);
            }, 12000);

            audio.play().catch(function (err) {
                console.warn('音频播放失败：', err);
            });
        }

        document.addEventListener('click', function (e) {
            triggerAll(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
        });

        document.addEventListener('touchstart', function (e) {
            const t = e.touches[0];
            triggerAll(t.clientX, t.clientY);
        }, { passive: true });
    </script>
</body>
</html>
